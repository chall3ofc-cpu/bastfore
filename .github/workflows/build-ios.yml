name: Gratis iOS Bygge

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Gör att du kan starta bygget manuellt om du vill

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4

      - name: Installera Bun
        uses: oven-sh/setup-bun@v1

      - name: Installera beroenden
        run: bun install

      - name: Bygg webbkoden
        run: bun run build

      - name: Synka Capacitor
        run: npx cap sync ios

      - name: Bygg iPhone-appen i Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build
